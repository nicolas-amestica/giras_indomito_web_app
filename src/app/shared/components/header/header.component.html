<div class="apple-navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a routerLink="/" class="logo-link">
      <img
        src="/assets/images/logo/logo-web-small.png"
        alt="Giras Indómito"
        class="logo-image"
        width="94"
        height="48"
      />
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}"
        class="nav-link"
      >
        Inicio
      </a>
      <a
        routerLink="/services"
        routerLinkActive="active"
        class="nav-link"
      >
        Servicios
      </a>
      <a
        routerLink="/about"
        routerLinkActive="active"
        class="nav-link"
      >
        Nosotros
      </a>
      <a
        routerLink="/contact"
        routerLinkActive="active"
        class="nav-link nav-quote"
      >
        Cotiza tu viaje
      </a>
      <a href="http://pagos.dev.girasindomito.cl/" target="_blank" rel="noopener noreferrer" class="nav-link nav-payment">Portal de pagos ↗</a>
    </nav>

    <!-- Mobile Menu Button -->
    <button
      class="mobile-menu-button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Toggle menu"
    >
      <span class="menu-icon" [class.open]="isMobileMenuOpen">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
  </div>
</div>

<!-- Mobile Menu Overlay -->
<div class="mobile-menu-overlay" [class.open]="isMobileMenuOpen" (click)="closeMobileMenu()">
  <nav class="mobile-nav" (click)="$event.stopPropagation()">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{exact: true}"
      class="mobile-nav-link"
      (click)="closeMobileMenu()"
    >
      Inicio
    </a>
    <a
      routerLink="/services"
      routerLinkActive="active"
      class="mobile-nav-link"
      (click)="closeMobileMenu()"
    >
      Servicios
    </a>
    <a
      routerLink="/about"
      routerLinkActive="active"
      class="mobile-nav-link"
      (click)="closeMobileMenu()"
    >
      Nosotros
    </a>
    <a
      routerLink="/contact"
      routerLinkActive="active"
      class="mobile-nav-link"
      (click)="closeMobileMenu()"
    >
      Contacto
    </a>
    <a href="http://pagos.dev.girasindomito.cl/" target="_blank" rel="noopener noreferrer" class="mobile-nav-link nav-payment" (click)="closeMobileMenu()">Portal de pagos ↗</a>
  </nav>
</div>
